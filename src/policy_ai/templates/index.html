{% extends "base.html" %}

{% block title %}PolicyAI{% endblock %}

{% block content %}

<section class="card">
    <div id="upload-feedback"></div>
    <h2>Documents</h2>

    <form
        hx-post="/ui/documents"
        hx-target="#upload-feedback"
        hx-swap="innerHTML"
        hx-encoding="multipart/form-data"
        hx-indicator="#upload-loading"
        hx-disabled-elt="#upload-button"
    >
        <input
            type="file"
            name="file"
            accept=".pdf"
            required
        >

        <button id="upload-button" type="submit">
            Upload PDF
        </button>
    </form>

    <div id="upload-loading" class="htmx-indicator upload-status">
        <span class="spinner"></span>
        Extracting, embedding, and indexing the document...
    </div>

    <div
        id="documents"
        hx-get="/ui/documents"
        hx-trigger="load"
    ></div>
</section>

<section class="card">
    <h2>Ask a question</h2>

    <form
        hx-post="/ui/ask"
        hx-target="#answer"
        hx-indicator="#question-loading"
        hx-disabled-elt="#ask-button"
        hx-on::after-request="
            if(event.detail.successful) {
                this.querySelector('textarea[name=question]').value = '';
            }
        "
    >
        <label for="document-select">Search in</label>

        <select
            id="document-select"
            name="document"
            hx-get="/ui/document-options"
            hx-trigger="load, documentsChanged from:body"
            hx-target="this"
            hx-swap="innerHTML"
        >
            <option value="">All documents</option>
        </select>

        <textarea
            name="question"
            rows="4"
            placeholder="Type your question ..."
            required
        ></textarea>

        <button id="ask-button" type="submit">
            Ask PolicyAI
        </button>
    </form>

    <div id="question-loading" class="htmx-indicator upload-status">
        <span class="spinner"></span>
        Searching documents and generating an answer...
    </div>
</section>

<section id="answer"></section>
{% endblock %}
