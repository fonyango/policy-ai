<section class="card">
    <p class="question-label">You asked</p>
    <p class="question-text">{{ question }}</p>

    <h2>Answer</h2>

    <div class="answer">
        {{ answer | safe }}
    </div>

    {% if sources %}
    <h3>Sources</h3>

    <div class="sources">
        {% for source in sources %}
        <article class="source-card">
            <strong>{{ source.document_title }}</strong>
            <p>{{ source.section }}</p>
            <small>
                Pages {{ source.page_start }}–{{ source.page_end }}
            </small>
        </article>
        {% endfor %}
    </div>
    {% endif %}
</section>
